<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Hyperprior hyperencoder and hyperdecoder architecture</title>
  <desc id="desc">Architecture diagram showing the hyperencoder from y to z and the hyperdecoder from quantized z to mu and sigma.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .panel { fill: #ffffff; stroke: #c8d2e0; stroke-width: 2; }
      .section { font: 700 24px Arial, sans-serif; fill: #1b2738; }
      .shape { font: 700 17px Arial, sans-serif; fill: #253044; }
      .small { font: 400 15px Arial, sans-serif; fill: #526079; }
      .tiny { font: 400 13px Arial, sans-serif; fill: #69758a; }
      .box-text { font: 700 18px Arial, sans-serif; fill: #172033; }
      .box-sub { font: 400 14px Arial, sans-serif; fill: #314057; }
      .tensor { fill: #e9f2ff; stroke: #4f7fc4; stroke-width: 2; }
      .conv { fill: #eef7ed; stroke: #4d9a57; stroke-width: 2; }
      .up { fill: #fff1df; stroke: #d5852d; stroke-width: 2; }
      .head-mu { fill: #f4edff; stroke: #8967c5; stroke-width: 2; }
      .head-sigma { fill: #fff0f3; stroke: #ca6478; stroke-width: 2; }
      .latent { fill: #eaf8f7; stroke: #2d938d; stroke-width: 2; }
      .note { fill: #f3f5f9; stroke: #c8d2e0; stroke-width: 1.5; }
      .arrow { stroke: #55647a; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .split { stroke: #55647a; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55647a" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect class="bg" width="1600" height="800"/>

  <rect class="panel" x="60" y="60" width="1480" height="255" rx="8" filter="url(#shadow)"/>
  <text class="section" x="90" y="103">Hyperencoder / Analysis network</text>

  <g transform="translate(90 155)">
    <rect class="tensor" x="0" y="0" width="190" height="88" rx="8"/>
    <text class="box-text" x="95" y="35" text-anchor="middle">Input y</text>
    <text class="box-sub" x="95" y="60" text-anchor="middle">(B, 16, 16, C=96)</text>

    <path class="arrow" d="M 202 44 L 262 44"/>
    <rect class="conv" x="275" y="0" width="205" height="88" rx="8"/>
    <text class="box-text" x="377.5" y="35" text-anchor="middle">Conv2D 3x3</text>
    <text class="box-sub" x="377.5" y="60" text-anchor="middle">192 channels, ReLU</text>
    <text class="tiny" x="377.5" y="78" text-anchor="middle">same padding</text>
    <text class="shape" x="377.5" y="116" text-anchor="middle">16 x 16 x 192</text>

    <path class="arrow" d="M 492 44 L 552 44"/>
    <rect class="conv" x="565" y="0" width="220" height="88" rx="8"/>
    <text class="box-text" x="675" y="35" text-anchor="middle">Conv2D 5x5</text>
    <text class="box-sub" x="675" y="60" text-anchor="middle">stride 2, 192 channels</text>
    <text class="tiny" x="675" y="78" text-anchor="middle">same padding, ReLU</text>
    <text class="shape" x="675" y="116" text-anchor="middle">8 x 8 x 192</text>

    <path class="arrow" d="M 797 44 L 857 44"/>
    <rect class="conv" x="870" y="0" width="220" height="88" rx="8"/>
    <text class="box-text" x="980" y="35" text-anchor="middle">Conv2D 5x5</text>
    <text class="box-sub" x="980" y="60" text-anchor="middle">stride 2, 192 channels</text>
    <text class="tiny" x="980" y="78" text-anchor="middle">same padding, linear</text>
    <text class="shape" x="980" y="116" text-anchor="middle">4 x 4 x 192</text>

    <path class="arrow" d="M 1102 44 L 1162 44"/>
    <rect class="latent" x="1175" y="0" width="195" height="88" rx="8"/>
    <text class="box-text" x="1272.5" y="35" text-anchor="middle">Hyperlatents z</text>
    <text class="box-sub" x="1272.5" y="60" text-anchor="middle">(B, 4, 4, N=192)</text>
  </g>

  <g transform="translate(600 335)">
    <rect class="note" x="0" y="0" width="400" height="70" rx="8"/>
    <text class="box-text" x="200" y="30" text-anchor="middle">Quantize / entropy code z</text>
    <text class="box-sub" x="200" y="52" text-anchor="middle">decoder receives z_hat with the same 4 x 4 x 192 shape</text>
  </g>
  <rect class="panel" x="60" y="435" width="1480" height="300" rx="8" filter="url(#shadow)"/>
  <text class="section" x="90" y="478">Hyperdecoder / Synthesis network</text>

  <g transform="translate(90 540)">
    <rect class="latent" x="0" y="0" width="185" height="88" rx="8"/>
    <text class="box-text" x="92.5" y="35" text-anchor="middle">Input z_hat</text>
    <text class="box-sub" x="92.5" y="60" text-anchor="middle">(B, 4, 4, 192)</text>

    <path class="arrow" d="M 197 44 L 247 44"/>
    <rect class="up" x="260" y="0" width="190" height="88" rx="8"/>
    <text class="box-text" x="355" y="35" text-anchor="middle">Bilinear upsample</text>
    <text class="box-sub" x="355" y="60" text-anchor="middle">scale factor 2</text>
    <text class="shape" x="355" y="116" text-anchor="middle">8 x 8 x 192</text>

    <path class="arrow" d="M 462 44 L 512 44"/>
    <rect class="conv" x="525" y="0" width="190" height="88" rx="8"/>
    <text class="box-text" x="620" y="35" text-anchor="middle">Conv2D 5x5</text>
    <text class="box-sub" x="620" y="60" text-anchor="middle">192 channels, ReLU</text>
    <text class="tiny" x="620" y="78" text-anchor="middle">same padding</text>

    <path class="arrow" d="M 727 44 L 777 44"/>
    <rect class="up" x="790" y="0" width="190" height="88" rx="8"/>
    <text class="box-text" x="885" y="35" text-anchor="middle">Bilinear upsample</text>
    <text class="box-sub" x="885" y="60" text-anchor="middle">scale factor 2</text>
    <text class="shape" x="885" y="116" text-anchor="middle">16 x 16 x 192</text>

    <path class="arrow" d="M 992 44 L 1042 44"/>
    <rect class="conv" x="1055" y="0" width="190" height="88" rx="8"/>
    <text class="box-text" x="1150" y="35" text-anchor="middle">Conv2D 5x5</text>
    <text class="box-sub" x="1150" y="60" text-anchor="middle">192 channels, ReLU</text>
    <text class="tiny" x="1150" y="78" text-anchor="middle">same padding</text>

    <path class="split" d="M 1257 44 C 1280 44, 1245 -33, 1262 -33"/>
    <rect class="head-mu" x="1275" y="-77" width="170" height="88" rx="8"/>
    <text class="box-text" x="1360" y="-43" text-anchor="middle">Conv2D 3x3</text>
    <text class="box-sub" x="1360" y="-19" text-anchor="middle">96 channels</text>
    <text class="tiny" x="1360" y="1" text-anchor="middle">linear mean</text>
    <text class="shape" x="1360" y="-100" text-anchor="middle">mu: 16 x 16 x 96</text>

    <path class="split" d="M 1257 44 C 1280 44, 1245 122, 1262 122"/>
    <rect class="head-sigma" x="1275" y="78" width="170" height="88" rx="8"/>
    <text class="box-text" x="1360" y="106" text-anchor="middle">Conv2D 3x3</text>
    <text class="box-sub" x="1360" y="130" text-anchor="middle">96 channels</text>
    <text class="tiny" x="1360" y="150" text-anchor="middle">softplus + 0.11</text>
    <text class="shape" x="1360" y="194" text-anchor="middle">sigma: 16 x 16 x 96</text>
  </g>

  <path class="arrow" d="M 1362 243 C 1245 275, 1090 315, 1005 370"/>
  <path class="arrow" d="M 600 370 C 410 430, 245 584, 82 584"/>

  <g transform="translate(85 760)">
    <text class="tiny" x="0" y="0">C = 96 latent channels; N = 192 hyperprior channels; minimum scale = 0.11. The synthesis path uses bilinear upsampling followed by convolution.</text>
  </g>
</svg>
