<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="510" viewBox="40 110 1520 485" role="img" aria-labelledby="title desc">
  <title id="title">TFLite Decoder Architecture</title>
  <desc id="desc">Architecture diagram for tflite/model/decoder.py showing latent input, entry projection, nine residual blocks, four bilinear upsample stages, and RGB sigmoid output.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .label { font: 700 19px Arial, sans-serif; fill: #1d2937; }
      .small { font: 15px Arial, sans-serif; fill: #4a5666; }
      .tiny { font: 13px Arial, sans-serif; fill: #5c6878; }
      .shape { fill: #ffffff; stroke: #9aa8b8; stroke-width: 2; rx: 8; }
      .input { fill: #e7f5ef; stroke: #4b9b78; }
      .core { fill: #edf3ff; stroke: #5c7fc4; }
      .res { fill: #fff4e8; stroke: #d1873f; }
      .up { fill: #f0eefc; stroke: #7c66c5; }
      .out { fill: #fdeff2; stroke: #c95d72; }
      .note { fill: #ffffff; stroke: #c6ced8; stroke-width: 1.5; rx: 8; }
      .arrow { stroke: #4a5666; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .skip { stroke: #d1873f; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrowhead-orange); }
      .thin { stroke: #9aa8b8; stroke-width: 2; fill: none; marker-end: url(#arrowhead-light); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#4a5666"/>
    </marker>
    <marker id="arrowhead-light" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#9aa8b8"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#d1873f"/>
    </marker>
  </defs>

  <rect class="bg" x="40" y="110" width="1520" height="485"/>

  <rect class="shape input" x="70" y="185" width="190" height="120"/>
  <text class="label" x="165" y="225" text-anchor="middle">Latents</text>
  <text class="small" x="165" y="255" text-anchor="middle">(B, 16, 16, 96)</text>
  <text class="tiny" x="165" y="282" text-anchor="middle">latents_in</text>

  <path class="arrow" d="M260 245 H320"/>

  <rect class="shape core" x="320" y="176" width="245" height="138"/>
  <text class="label" x="442.5" y="218" text-anchor="middle">Entry Projection</text>
  <text class="small" x="442.5" y="249" text-anchor="middle">LayerNorm</text>
  <text class="small" x="442.5" y="274" text-anchor="middle">Conv2D 3x3: 96 -> 384</text>
  <text class="tiny" x="442.5" y="299" text-anchor="middle">same padding, no bias, LN</text>

  <path class="arrow" d="M565 245 H625"/>

  <rect class="shape res" x="625" y="162" width="300" height="166"/>
  <text class="label" x="775" y="207" text-anchor="middle">Bottleneck</text>
  <text class="small" x="775" y="240" text-anchor="middle">9 x ResidualBlock(384)</text>
  <text class="small" x="775" y="269" text-anchor="middle">spatial size stays 16 x 16</text>
  <text class="tiny" x="775" y="297" text-anchor="middle">dominates parameter count (~23.8M conv weights)</text>

  <path class="arrow" d="M925 245 H985"/>

  <rect class="shape up" x="985" y="130" width="260" height="230"/>
  <text class="label" x="1115" y="174" text-anchor="middle">Upsample Pyramid</text>
  <text class="small" x="1115" y="208" text-anchor="middle">4 x [bilinear upsample</text>
  <text class="small" x="1115" y="234" text-anchor="middle">+ Conv2D 3x3 + LN + ReLU]</text>
  <text class="tiny" x="1115" y="269" text-anchor="middle">16 -> 32: 384 -> 192</text>
  <text class="tiny" x="1115" y="292" text-anchor="middle">32 -> 64: 192 -> 96</text>
  <text class="tiny" x="1115" y="315" text-anchor="middle">64 -> 128: 96 -> 64</text>
  <text class="tiny" x="1115" y="338" text-anchor="middle">128 -> 256: 64 -> 32</text>

  <path class="arrow" d="M1245 245 H1305"/>

  <rect class="shape out" x="1305" y="185" width="225" height="120"/>
  <text class="label" x="1417.5" y="225" text-anchor="middle">RGB Head</text>
  <text class="small" x="1417.5" y="255" text-anchor="middle">Conv2D 7x7: 32 -> 3</text>
  <text class="small" x="1417.5" y="282" text-anchor="middle">Sigmoid, (B, 256, 256, 3)</text>

  <text class="label" x="70" y="415">ResidualBlock(384) detail</text>
  <rect class="shape res" x="70" y="455" width="190" height="96"/>
  <text class="small" x="165" y="494" text-anchor="middle">Input x</text>
  <text class="tiny" x="165" y="520" text-anchor="middle">(B, 16, 16, 384)</text>
  <path class="arrow" d="M260 503 H325"/>
  <rect class="shape res" x="325" y="455" width="190" height="96"/>
  <text class="small" x="420" y="486" text-anchor="middle">Conv2D 3x3</text>
  <text class="tiny" x="420" y="511" text-anchor="middle">384 -> 384</text>
  <text class="tiny" x="420" y="533" text-anchor="middle">LayerNorm + ReLU</text>
  <path class="arrow" d="M515 503 H580"/>
  <rect class="shape res" x="580" y="455" width="190" height="96"/>
  <text class="small" x="675" y="486" text-anchor="middle">Conv2D 3x3</text>
  <text class="tiny" x="675" y="511" text-anchor="middle">384 -> 384</text>
  <text class="tiny" x="675" y="533" text-anchor="middle">LayerNorm</text>
  <path class="arrow" d="M770 503 H835"/>
  <rect class="shape res" x="835" y="455" width="160" height="96"/>
  <text class="small" x="915" y="494" text-anchor="middle">Add</text>
  <text class="tiny" x="915" y="520" text-anchor="middle">x + residual</text>
  <path class="skip" d="M165 455 C165 395, 915 395, 915 455"/>

  <rect class="note" x="70" y="640" width="455" height="155"/>
  <text class="label" x="95" y="678">TFLite-safe substitutions</text>
  <text class="small" x="95" y="715">ConvTranspose2D becomes bilinear UpSampling2D + Conv2D</text>
  <text class="small" x="95" y="746">ReflectionPad2d becomes same padding</text>
  <text class="small" x="95" y="777">ChannelNorm2D / InstanceNorm2D becomes LayerNormalization</text>

  <rect class="note" x="575" y="640" width="455" height="155"/>
  <text class="label" x="600" y="678">Tensor layout</text>
  <text class="small" x="600" y="715">Keras / TFLite channels-last tensors: (B, H, W, C)</text>
  <text class="small" x="600" y="746">Input resolution is fixed at 16 x 16 in build_decoder()</text>
  <text class="small" x="600" y="777">Four 2x stages reconstruct 256 x 256 output</text>

  <rect class="note" x="1080" y="640" width="450" height="155"/>
  <text class="label" x="1105" y="678">Review notes</text>
  <text class="small" x="1105" y="715">No train-time stochastic noise branch in this TFLite decoder</text>
  <text class="small" x="1105" y="746">Final sigmoid constrains pixels to [0, 1]</text>
  <text class="small" x="1105" y="777">Comments estimate about 25M trainable parameters</text>

  <path class="thin" d="M775 328 V388"/>
  <text class="tiny" x="790" y="371">expanded below</text>
</svg>
